apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecasting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forecasting
  template:
    metadata:
      labels:
        app: forecasting
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: forecasting
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: forecasting
          # Pinned to a real tag, not :latest. ArgoCD's kustomize image
          # override normally replaces this, but the override is keyed on
          # this image's NAME -- so anything that breaks the match falls
          # back to whatever is written here. It used to say :latest, which
          # CI stopped publishing in #165, so the fallback was a tag that
          # did not exist and the failure mode was an unpullable prod.
          image: us-central1-docker.pkg.dev/ethans-services/containers/haruspex:f66c410
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "5m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
