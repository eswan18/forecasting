# The two Applications for this service, following the forecasting -> haruspex
# rename. The forecasting-* pair that ran beside these until the cutover is
# gone, along with the k8s/base, k8s/staging and k8s/prod trees they pointed at.
#
# Correcting what an earlier revision of this comment claimed: `prune: true`
# does NOT make deleting an Application take its workloads with it. It governs
# pruning at sync time, for resources that leave git. Cascading deletion needs
# the resources-finalizer.argocd.argoproj.io finalizer, which these do not
# carry -- so deleting one of these Applications orphans its workloads and the
# namespace delete is what actually removes them. Order still matters, for a
# different reason: with selfHeal on, deleting a namespace out from under a
# live Application just has ArgoCD recreate it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: haruspex-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eswan18/haruspex
    targetRevision: main
    path: k8s/haruspex-staging
  destination:
    server: https://kubernetes.default.svc
    namespace: haruspex-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: haruspex-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eswan18/haruspex
    targetRevision: main
    path: k8s/haruspex-prod
    # Seeded with whatever forecasting-prod was serving when this was written.
    # Prod carries no image-updater by design, so without an override here the
    # new Deployment would resolve the base's :override-required tripwire and
    # stall -- correct behaviour, but it would look like a broken rollout. This
    # is the same field `bif promote` writes, so promotion keeps working
    # normally afterwards and this value is only ever a starting point.
    # Re-pin it to prod's current tag at cutover if prod has moved since.
    kustomize:
      images:
        - us-central1-docker.pkg.dev/ethans-services/containers/haruspex=us-central1-docker.pkg.dev/ethans-services/containers/haruspex:6588852
  destination:
    server: https://kubernetes.default.svc
    namespace: haruspex-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
